services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gow
      POSTGRES_PASSWORD: gow_change_me
      POSTGRES_DB: gow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gow -d gow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gowminio
      MINIO_ROOT_PASSWORD: gowminio_change_me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 gowminio gowminio_change_me;
      mc mb -p local/gov-office-files || true;
      mc anonymous set none local/gov-office-files;
      exit 0;
      "

  # Optional full stack — build from monorepo root:
  #   docker compose -f deploy/docker-compose.yml --profile apps up --build
  api:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://gow:gow_change_me@postgres:5432/gow
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: gowminio
      S3_SECRET_KEY: gowminio_change_me
      S3_BUCKET: gov-office-files
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars!!
      JWT_REFRESH_SECRET: change-me-refresh-secret-min-32-chars!
      APP_URL: http://localhost:3000
      API_PORT: "4000"
      MFA_REQUIRED: "true"
      STORAGE_DRIVER: local
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      NEXT_PUBLIC_MFA_REQUIRED: "true"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
